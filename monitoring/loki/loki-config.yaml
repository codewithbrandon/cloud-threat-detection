# =============================================================================
# Loki Configuration — Log Aggregation
# =============================================================================
# WHY LOKI OVER ELK:
# Loki is label-indexed (not full-text indexed), making it extremely efficient
# for structured log queries. It integrates natively with Grafana and Prometheus
# labels, enabling log-metric correlation in a single dashboard.
# Storage cost is 90% lower than Elasticsearch at equivalent scale.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: threat-detection
  labels:
    app: loki
    component: logging
data:
  loki.yaml: |
    auth_enabled: false  # Single-tenant demo; enable in multi-tenant production

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
      log_format: json

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # ==========================================================================
    # Schema configuration
    # WHY: TSDB schema (v13) provides efficient time-range queries for
    # incident investigation. Using boltdb-shipper in development; switch to
    # S3/GCS in production for HA and cost efficiency.
    # ==========================================================================
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Retention: 30 days for security investigations
    # WHY: SOC teams require minimum 30-day log retention for incident review.
    # Extend to 90 days if compliance requires (PCI-DSS, SOC 2 Type II).
    limits_config:
      retention_period: 720h   # 30 days
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_query_parallelism: 32
      # Enforce structured label cardinality to prevent index explosion
      max_label_names_per_series: 15
      max_label_value_length: 2048

    ruler:
      alertmanager_url: http://alertmanager:9093

    # ==========================================================================
    # Loki Alerting Rules (LogQL-based)
    # WHY: Log-based alerts catch attack patterns visible in logs but not
    # metrics — e.g., specific error messages, command strings, usernames.
    # ==========================================================================
    ruler:
      alertmanager_url: http://alertmanager:9093
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules
      enable_api: true

    analytics:
      reporting_enabled: false  # No telemetry in production

---
# Loki Alerting Rules (LogQL)
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alert-rules
  namespace: threat-detection
  labels:
    app: loki
    component: alert-rules
data:
  security-log-alerts.yaml: |
    groups:
      - name: security_log_alerts
        interval: 1m
        rules:
          # -------------------------------------------------------------------
          # Log-based brute force detection
          # WHY: Complements Prometheus metric alert. Log-based detection catches
          # distributed attacks where each IP stays below the per-IP threshold.
          # Pattern: AUTHENTICATION_FAILURE appearing >20 times/minute globally.
          # -------------------------------------------------------------------
          - alert: BruteForceInLogs
            expr: |
              sum(count_over_time({app="threat-detection-app"}
                |= "AUTHENTICATION_FAILURE" [1m])) > 20
            for: 0m
            labels:
              severity: warning
              team: security
              category: authentication
            annotations:
              summary: "Log-based brute force: >20 auth failures in 1 minute"
              description: |
                LogQL detected >20 AUTHENTICATION_FAILURE events in logs.
                This catches distributed attacks below per-IP metric thresholds.
                Query Loki: {app="threat-detection-app"} |= "AUTHENTICATION_FAILURE"

          # -------------------------------------------------------------------
          # Suspicious exec detection via logs
          # WHY: Falco may not catch every exec pattern. Log-based detection
          # provides a second layer using application-reported events.
          # -------------------------------------------------------------------
          - alert: SuspiciousExecInLogs
            expr: |
              sum(count_over_time({app="threat-detection-app"}
                |= "SUSPICIOUS_EXEC_EVENT" [5m])) > 0
            for: 0m
            labels:
              severity: critical
              team: security
              category: container_security
            annotations:
              summary: "Shell execution detected in container"
              description: |
                Application logged SUSPICIOUS_EXEC_EVENT.
                Correlate with Falco alert: shell_spawned_in_container.
                This may indicate active container compromise.

          # -------------------------------------------------------------------
          # Memory exhaustion detection via logs
          # -------------------------------------------------------------------
          - alert: MemoryExhaustionInLogs
            expr: |
              sum(count_over_time({app="threat-detection-app"}
                |= "MEMORY_PRESSURE_EVENT" [5m])) > 3
            for: 0m
            labels:
              severity: warning
              team: platform
              category: resource
            annotations:
              summary: "Memory exhaustion events detected in logs"
              description: |
                3+ memory exhaustion events logged in 5 minutes.
                Risk: OOM kill. Review pod resource usage.

          # -------------------------------------------------------------------
          # CPU spike detection via logs
          # -------------------------------------------------------------------
          - alert: CPUSpikeInLogs
            expr: |
              sum(count_over_time({app="threat-detection-app"}
                |= "CPU_SPIKE_EVENT" [5m])) > 0
            for: 0m
            labels:
              severity: warning
              team: security
              category: resource_abuse
            annotations:
              summary: "CPU spike event triggered"
              description: |
                CPU spike simulation endpoint was triggered.
                Verify this is authorized testing. If not, investigate source IP.
