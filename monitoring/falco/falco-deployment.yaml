# =============================================================================
# Falco DaemonSet — Runtime Security Monitor
# =============================================================================
# WHY DaemonSet: Falco must run on every node because syscall interception
# is per-node. A single cluster-level deployment would only monitor one node.
#
# DRIVER OPTIONS:
# 1. kernel module (falco-driver): Requires privileged mode — lowest overhead
# 2. eBPF probe (falco-ebpf): Requires CAP_BPF — preferred for modern kernels
# 3. modern eBPF (falco-modern-ebpf): Built-in, no driver install needed
#
# This deployment uses modern eBPF (Linux 5.8+) for maximum compatibility.
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: threat-detection
  labels:
    app: falco
    component: runtime-security
spec:
  selector:
    matchLabels:
      app: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: falco
        component: runtime-security
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: falco
      # Falco needs host PID/network visibility for syscall context
      hostPID: true
      hostNetwork: false

      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

      containers:
        - name: falco
          # Use official Falco image with modern eBPF support
          image: falcosecurity/falco-no-driver:0.38.1
          args:
            - /usr/bin/falco
            - --modern-bpf              # Use modern eBPF driver
            - -r /etc/falco/falco.yaml
            - -r /etc/falco/custom-rules/falco-rules.yaml
            - --log-level=info
            - -o "json_output=true"      # JSON for Loki structured ingestion
            - -o "log_stderr=true"
            - -o "output_timeout=2000"
            # Send alerts to Falcosidekick for fan-out delivery
            - -o "http_output.enabled=true"
            - -o "http_output.url=http://falcosidekick:2801"

          # Falco requires elevated privileges to load eBPF programs
          securityContext:
            privileged: false
            capabilities:
              add:
                - SYS_PTRACE      # Required for syscall tracing
                - SYS_ADMIN       # Required for eBPF program loading
              drop:
                - NET_RAW
                - NET_ADMIN

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 15

          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
            - name: custom-rules
              mountPath: /etc/falco/custom-rules
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: boot
              mountPath: /host/boot
              readOnly: true
            - name: lib-modules
              mountPath: /host/lib/modules
              readOnly: true
            - name: usr
              mountPath: /host/usr
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            - name: dev
              mountPath: /host/dev

      volumes:
        - name: falco-config
          configMap:
            name: falco-config
        - name: custom-rules
          configMap:
            name: falco-custom-rules
        - name: proc
          hostPath:
            path: /proc
        - name: boot
          hostPath:
            path: /boot
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: usr
          hostPath:
            path: /usr
        - name: etc
          hostPath:
            path: /etc
        - name: dev
          hostPath:
            path: /dev

---
# Falco base configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: threat-detection
  labels:
    app: falco
data:
  falco.yaml: |
    rules_file:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/falco_rules.local.yaml
      - /etc/falco/custom-rules/

    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    log_stderr: true
    log_syslog: false
    log_level: info

    priority: DEBUG

    # Output rate limiting — prevent alert flooding
    outputs:
      rate: 1
      max_burst: 1000

    # HTTP output to Falcosidekick for fan-out
    http_output:
      enabled: true
      url: http://falcosidekick:2801
      user_agent: "falcosecurity/falco"

    # gRPC output for programmatic alert consumption
    grpc:
      enabled: false

    # Web server for health checks and Prometheus metrics
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
      prometheus_metrics_enabled: true

---
# Falco custom rules ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: threat-detection
  labels:
    app: falco
data:
  custom-rules.yaml: |
    # Import the external rules file content here
    # In production, mount falco-rules.yaml directly
    # See monitoring/falco/falco-rules.yaml for full rule content

---
# Falco ServiceAccount + RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: threat-detection
  labels:
    app: falco

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
  labels:
    app: falco
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "replicationcontrollers",
                "services", "serviceaccounts", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
  labels:
    app: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
  - kind: ServiceAccount
    name: falco
    namespace: threat-detection

---
# =============================================================================
# Falcosidekick — Alert Fan-out Router
# =============================================================================
# WHY: Falco outputs raw alerts. Falcosidekick routes them to:
# Slack, Teams, PagerDuty, Alertmanager, Loki, and more.
# This decouples Falco from notification delivery (same pattern as Alertmanager).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  namespace: threat-detection
  labels:
    app: falcosidekick
    component: runtime-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falcosidekick
  template:
    metadata:
      labels:
        app: falcosidekick
        component: runtime-security
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falcosidekick
          image: falcosecurity/falcosidekick:2.29.0
          ports:
            - name: web
              containerPort: 2801
            - name: metrics
              containerPort: 2802
          env:
            # Route Falco alerts to Alertmanager
            - name: ALERTMANAGER_HOSTPORT
              value: "http://alertmanager:9093"
            - name: ALERTMANAGER_ENDPOINT
              value: "/api/v1/alerts"
            # Route Falco alerts to Loki for log correlation
            - name: LOKI_HOSTPORT
              value: "http://loki:3100"
            - name: LOKI_ENDPOINT
              value: "/loki/api/v1/push"
            # Route to Slack webhook simulator
            - name: SLACK_WEBHOOKURL
              value: "http://webhook-simulator:9099/falco-slack"
            - name: SLACK_CHANNEL
              value: "#security-incidents"
            - name: SLACK_MINIMUMPRIORITY
              value: "warning"
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: falcosidekick
  namespace: threat-detection
  labels:
    app: falcosidekick
spec:
  type: ClusterIP
  selector:
    app: falcosidekick
  ports:
    - name: web
      port: 2801
      targetPort: 2801
    - name: metrics
      port: 2802
      targetPort: 2802
