# =============================================================================
# Deployment — threat-detection-app
# =============================================================================
# Security controls applied at every layer: Pod spec, container spec,
# securityContext, resource limits, and probe configuration.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-detection-app
  namespace: threat-detection
  labels:
    app: threat-detection-app
    component: application
    version: "1.0.0"
  annotations:
    # Deployment annotations for change tracking and audit
    deployment.kubernetes.io/revision: "1"
    security.policy/last-reviewed: "2024-01-01"
    security.policy/reviewed-by: "platform-security-team"
spec:
  replicas: 2

  selector:
    matchLabels:
      app: threat-detection-app

  # Rolling update — zero-downtime deployments
  # WHY: maxUnavailable=0 ensures alert coverage is never interrupted during updates.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: threat-detection-app
        component: application
        version: "1.0.0"
      annotations:
        # Prometheus scrape annotations (legacy; ServiceMonitor is preferred)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      # Use dedicated ServiceAccount with no API server token
      serviceAccountName: threat-detection-app
      automountServiceAccountToken: false

      # ---------------------------------------------------------------------------
      # Pod-level security context
      # WHY: Pod-level settings apply to all containers in the pod.
      # runAsNonRoot ensures the container cannot run as UID 0 regardless of image.
      # seccompProfile restricts the syscall surface area available to the process.
      # ---------------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        # RuntimeDefault seccomp profile blocks ~100 uncommon syscalls
        # WHY: Reduces syscall surface that Falco must monitor, lowering noise.
        seccompProfile:
          type: RuntimeDefault

      # Topology spread for high availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: threat-detection-app

      containers:
        - name: threat-detection-app
          image: threat-detection-app:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ---------------------------------------------------------------------------
          # Container-level security context
          # WHY: Defense in depth — container-level controls supplement pod-level ones.
          # allowPrivilegeEscalation: false blocks setuid/setgid escalation.
          # readOnlyRootFilesystem forces attackers to use /tmp (which we monitor).
          # capabilities drop ALL removes network raw, CAP_NET_BIND_SERVICE, etc.
          # ---------------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
              # Do NOT add ANY capabilities back. Even NET_BIND_SERVICE is unnecessary
              # since we run on port 8080, not 80.

          # ---------------------------------------------------------------------------
          # Resource limits — prevent noisy-neighbor attacks and enable HPA
          # WHY: Without limits, a single pod can exhaust node CPU/memory.
          # Limits also enable Prometheus CPU/memory alerting with meaningful thresholds.
          # Request:Limit ratio of 1:4 allows burst while preventing starvation.
          # ---------------------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"      # Trigger alert at ~80% = 400m sustained
              memory: "512Mi"  # OOM kill threshold — alert at 75% = 384Mi

          # Load configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: threat-detection-config

          # ---------------------------------------------------------------------------
          # Liveness probe — restarts pod if app is deadlocked or hung
          # WHY: Gunicorn workers can deadlock under sustained CPU spike.
          # 30s initialDelay allows workers to boot before probes start.
          # 3 consecutive failures trigger restart → Alertmanager "PodCrashLoop" alert.
          # ---------------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ---------------------------------------------------------------------------
          # Readiness probe — removes pod from Service load balancer when not ready
          # WHY: During CPU spike simulation, the app may be slow to respond.
          # Readiness failure prevents routing traffic to an overwhelmed pod
          # without triggering a restart (unlike liveness).
          # ---------------------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1

          # Startup probe — longer timeout for initial container startup
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12  # 60s total startup budget

          # ---------------------------------------------------------------------------
          # Volume mounts — only /tmp is writable (readOnlyRootFilesystem: true)
          # WHY: Any write to /tmp is logged. Attackers cannot install tools
          # or create persistence in /bin, /usr, /etc, etc.
          # ---------------------------------------------------------------------------
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /app/logs

      # Volumes: use emptyDir (ephemeral, not hostPath)
      # WHY: hostPath volumes give containers access to node filesystem — avoid.
      # emptyDir is isolated to the pod lifecycle and cleaned up on pod deletion.
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory  # RAM-backed to limit disk I/O attack surface
            sizeLimit: 64Mi
        - name: logs-volume
          emptyDir:
            sizeLimit: 256Mi

      # Graceful shutdown — allow 30s for in-flight requests to complete
      terminationGracePeriodSeconds: 30

      # Node affinity for production scheduling (adjust per cluster)
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: node-role.kubernetes.io/worker
      #           operator: Exists
