# =============================================================================
# ConfigMap — Application Configuration
# =============================================================================
# WHY: Externalize configuration from the container image.
# Secrets (API keys, passwords) must NEVER be stored in ConfigMaps —
# use Kubernetes Secrets or an external secrets manager (Vault, AWS SSM).
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: threat-detection-config
  namespace: threat-detection
  labels:
    app: threat-detection-app
    component: config
data:
  # Application settings
  APP_VERSION: "1.0.0"
  PORT: "8080"
  FLASK_DEBUG: "false"

  # Logging configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Feature flags for attack simulation endpoints
  # WHY: Disable attack simulation in environments where you don't want
  # to generate false positives in production alerting.
  ENABLE_ATTACK_SIMULATION: "true"
  ENABLE_METRICS: "true"

  # Prometheus configuration
  PROMETHEUS_METRICS_PATH: "/metrics"

  # Resource limits for simulation endpoints
  MAX_CPU_SPIKE_DURATION_SECONDS: "60"
  MAX_MEMORY_ALLOCATION_MB: "512"
