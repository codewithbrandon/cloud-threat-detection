# =============================================================================
# ServiceAccount — threat-detection-app
# =============================================================================
# WHY: Every Pod uses the default ServiceAccount unless specified otherwise.
# The default SA often has broad RBAC permissions and a mounted token that
# attackers can use to query the Kubernetes API after container compromise.
#
# We create a dedicated SA with:
# - automountServiceAccountToken: false (no API server access from app)
# - No bound ClusterRole or Role (zero K8s API permissions)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-detection-app
  namespace: threat-detection
  labels:
    app: threat-detection-app
    component: application
  annotations:
    # Document the minimal-privilege decision for audit trail
    security.policy/token-mounted: "false"
    security.policy/api-access: "none"
automountServiceAccountToken: false
